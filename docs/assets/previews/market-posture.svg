<svg xmlns="http://www.w3.org/2000/svg" width="640" height="472" aria-labelledby="title desc" role="img" viewBox="0 0 640 472"><title id="title">Illustrative Exposure Coach market posture</title><desc id="desc">Fictional breadth and uptrend scores of 60 result in a 36 percent exposure ceiling, REDUCE_ONLY recommendation, and LOW confidence because regime and top-risk inputs are missing.</desc><rect width="640" height="472" fill="#f3f7fa"/><rect width="600" height="432" x="20" y="20" fill="#fff" stroke="#d8e3eb" stroke-width="2" rx="18"/><rect width="600" height="54" x="20" y="20" fill="#123047" rx="18"/><rect width="600" height="20" x="20" y="54" fill="#123047"/><text x="42" y="55" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Market Posture Summary</text><rect width="560" height="35" x="40" y="94" fill="#fff0cb" rx="7"/><text x="54" y="118" fill="#5a4100" font-family="Arial, sans-serif" font-size="18" font-weight="700">ILLUSTRATIVE / FICTIONAL DATA</text><text x="42" y="167" fill="#53687a" font-family="Arial, sans-serif" font-size="18">EXPOSURE CEILING</text><text x="42" y="224" fill="#123047" font-family="Arial, sans-serif" font-size="52" font-weight="700">36%</text><rect width="294" height="53" x="272" y="170" fill="#dcecef" rx="9"/><text x="291" y="204" fill="#075762" font-family="Arial, sans-serif" font-size="22" font-weight="700">REDUCE_ONLY</text><line x1="42" x2="598" y1="245" y2="245" stroke="#d8e3eb" stroke-width="2"/><text x="42" y="282" fill="#53687a" font-family="Arial, sans-serif" font-size="18">CONFIDENCE</text><text x="217" y="282" fill="#9b470c" font-family="Arial, sans-serif" font-size="20" font-weight="700">LOW</text><text x="42" y="321" fill="#123047" font-family="Arial, sans-serif" font-size="19">Provided: breadth 60 · uptrend 60</text><text x="42" y="351" fill="#123047" font-family="Arial, sans-serif" font-size="19">Missing critical inputs: regime · top risk</text><text x="42" y="394" fill="#53687a" font-family="Arial, sans-serif" font-size="18">This is a posture for manual review, not a trade signal.</text><text x="42" y="428" fill="#53687a" font-family="Arial, sans-serif" font-size="17">Exposure Coach output excerpt · fictional scores</text></svg>